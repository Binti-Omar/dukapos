{% extends 'base.html' %}
{% block title %}Sales page {% endblock %}
{% block content %}

    <h1>This are our sales</h1>

    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        Add  sales
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Make sale</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/make_sale" method="post">
                        <label for="">Select a product</label>
                        <select class="form-select" name="pid">
                            {% for product in products %}
                            <option value="{{product[0]}}">{{product[1]}}</option>
                            {% endfor %}
                        </select>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" required name="quantity" class="form-control" id="quantity">
                        </div>

                        <button type="submit" class="btn btn-primary">Make sale</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <table class="table" id="example">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Product ID</th>
                <th scope="col">Quantity</th>
                <th scope="col">Created at</th>
            </tr>
        </thead>
        <tbody>
            {% for sale in sales %}
            <tr>
                <th scope="row">{{sale[0]}}</th>
                <td>{{sale[1]}}</td>
                <td>{{sale[2]}}</td>
                <td>{{sale[3]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
