{% extends 'base.html' %}
{% block title %}Products page {% endblock %}
{% block content %}

<h1>OUR PRODUCTS</h1>

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
    Add Products
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Products</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="/add_products" method="post">
                    <div class="mb-3">
                        <label for="p_name" class="form-label">Product Name</label>
                        <input type="text" required name="p_name" class="form-control" id="p_name">
                    </div>
                    <div class="mb-3">
                        <label for="b_price" class="form-label">Buying Price</label>
                        <input type="number" required name="b_price" class="form-control" id="b_price">
                    </div>
                    <div class="mb-3">
                        <label for="s_price" class="form-label">Selling Price</label>
                        <input type="number" required name="s_price" class="form-control" id="s_price">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<table class="table" id="example">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Product Name</th>
            <th scope="col">Buying Price</th>
            <th scope="col">Selling Price</th>
            <th>Edit</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <th scope="row">{{product[0]}}</th>
            <td>{{product[1]}}</td>
            <td>{{product[2]}}</td>
            <td>{{product[3]}}</td>
            <td><!-- Button trigger modal -->
                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#editproduct{{product[0]}}">
                    Edit
                </button>

                <!-- Modal -->
                <div class="modal fade" id="editproduct{{product[0]}}" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">Update product</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form action="/update_products" method="post">
                                    <div class="mb-3">
                                        <label for="p_name" class="form-label">Product Name</label>
                                        <input type="text" name="p_name" class="form-control" id="p_name">
                                    </div>
                                    <div class="mb-3">
                                        <label for="b_price" class="form-label">Buying Price</label>
                                        <input type="number" name="b_price" class="form-control" id="b_price">
                                    </div>
                                    <div class="mb-3">
                                        <label for="s_price" class="form-label">Selling Price</label>
                                        <input type="number" name="s_price" class="form-control" id="s_price">
                                    </div>
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-primary">Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
