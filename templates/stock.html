{% extends 'base.html' %}
{% block title %}Stock page {% endblock %}
{% block content %}

    <h1>This is the stock page</h1>

    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        Add stock
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Stock</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/add_stock" method="post">
                        <label for="products">Choose a product</label>
                        <select class="form-select" name="pid">
                            {% for product in products %}
                            <option value="{{product[0]}}">{{product[1]}}</option>
                            {% endfor %}
                        </select>
                        <div class="mb-3">
                            <label for="s_quantity" class="form-label">Stock Quantity</label>
                            <input type="number" required name="s_quantity" class="form-control" id="s_quantity">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <table class="table" id="example">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Product ID</th>
                <th scope="col">stock Quantity</th>
            </tr>
        </thead>
        <tbody>
            {% for stock in stock %}
            <tr>
                <th scope="row">{{stock[0]}}</th>
                <td>{{stock[1]}}</td>
                <td>{{stock[2]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
