{% extends 'base.html' %}
{% block title %}Register page {% endblock %}
{% block content %}
<form action="/register" method="post">
    <div class="mb-3">
        <div class="mb-3">
            <label for="f_name" class="form-label">Full Name</label>
            <input type="text" name="f_name" class="form-control" id="f_name" required>
        </div>
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" required>
    </div>
    <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <input type="text" name="role" required class="form-control" id="role">
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
